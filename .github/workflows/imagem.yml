name: Imagem

# Publica a imagem do comunicador em ghcr.io/<dono>/comunicador-fiscal.
#
# * tag vX.Y.Z: publica `X.Y.Z`, `X.Y` e `latest`;
# * botão "Run workflow": publica `manual` e `sha-<commit>`, sem mexer no `latest`.
#
# Só Linux (linux/amd64). A ACBrLib vem do repositório (server/embutida, licenças em
# server/licencas) e vai dentro da imagem, em /opt/acbr: quem roda a imagem não baixa
# nada. Antes de publicar, a imagem sobe e o /health tem de dizer `lib: true`.
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest tests -q

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/comunicador-fiscal
          flavor: |
            latest=false
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: A imagem sobe e carrega a ACBrLib
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          load: true
          tags: comunicador-fiscal:teste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: bash .github/scripts/testar-imagem.sh comunicador-fiscal:teste

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
