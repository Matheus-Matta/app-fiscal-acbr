name: Imagem

# Publica a imagem do comunicador em ghcr.io/<dono>/comunicador-fiscal.
#
# * chamado pelo release.yml (tag vX.Y.Z): publica `X.Y.Z`, `X.Y` e `latest` (sempre a última);
# * botão "Run workflow": publica `manual` e `sha-<commit>`, sem mexer no `latest`.
#
# Só Linux (linux/amd64). A ACBrLib vem do repositório (server/embutida, licenças em
# server/licencas) e vai dentro da imagem, em /opt/acbr: quem roda a imagem não baixa
# nada. Antes de publicar, a imagem sobe e o /health tem de dizer `lib: true`.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      versao:
        description: "Versão da imagem (1.2.0): publica 1.2.0, 1.2 e latest."
        type: string
        required: true
      ref:
        description: "O que gerar (refs/tags/v1.2.0)."
        type: string
        default: ""

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest tests -q

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/comunicador-fiscal
          flavor: |
            latest=false
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}},value=v${{ inputs.versao }},enable=${{ inputs.versao != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.versao }},enable=${{ inputs.versao != '' }}
            type=raw,value=latest,enable=${{ inputs.versao != '' }}
            type=raw,value=manual,enable=${{ inputs.versao == '' }}

      - name: A imagem sobe e carrega a ACBrLib
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          load: true
          tags: comunicador-fiscal:teste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: bash .github/scripts/testar-imagem.sh comunicador-fiscal:teste

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
